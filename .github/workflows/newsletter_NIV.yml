name: NIV Weekly Digest

on:
  pull_request:
    paths:
      - 'corsi.py'
      - 'corsi.json'
      - 'corsi.esempio.json'
      - 'newsletter_NIV.py'
      - 'config.py'
      - 'quality.py'
      - 'tests/**'
      - '.github/workflows/newsletter_NIV.yml'
  workflow_dispatch:  # Lancio manuale e da cron-job.org
    inputs:
      dry_run:
        description: "Prova a vuoto: esegue tutto ma NON invia email ne' Telegram"
        type: boolean
        default: false

# Evita doppi invii se cron-job.org spara due trigger ravvicinati:
# il secondo run attende (non cancella) ma non gira in parallelo.
concurrency:
  group: newsletter-niv-invio
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Controlla corsi.json
        # Non blocca l'invio: un errore compare come avviso giallo nel riepilogo del run.
        continue-on-error: true
        run: python corsi.py

  invia-newsletter-niv:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Nessuna dipendenza esterna: lo script usa solo la libreria standard
      # (invio via SMTP con smtplib).

      - name: Verifica test offline
        run: python -m unittest discover -s tests -v

      - name: Controlla corsi.json
        # Non blocca l'invio: un errore compare come avviso giallo nel riepilogo del run.
        continue-on-error: true
        run: python corsi.py

      - name: Esegui newsletter NIV
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Vuoto quando il workflow parte da cron-job.org: l'invio resta il default.
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python newsletter_NIV.py

      # Caricato anche quando lo step precedente fallisce: il log e' proprio
      # cio' che serve quando qualcosa e' andato storto.
      - name: Carica anteprima e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-niv-${{ github.run_number }}
          path: |
            anteprima_digest.html
            newsletter_niv.log
          if-no-files-found: warn
          retention-days: 30
