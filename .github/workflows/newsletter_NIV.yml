name: NIV Weekly Digest

on:
  pull_request:
    paths:
      - 'corsi.py'
      - 'instagram.py'
      - 'avviso.py'
      - 'x_social.py'
      - 'corsi.json'
      - 'corsi.esempio.json'
      - 'newsletter_NIV.py'
      - 'podcast.py'
      - 'config.py'
      - 'quality.py'
      - 'tests/**'
      - '.github/workflows/newsletter_NIV.yml'
  workflow_dispatch:  # Lancio manuale e da cron-job.org
    inputs:
      dry_run:
        description: "Prova a vuoto: esegue tutto ma NON invia email ne' Telegram"
        type: boolean
        default: false
      solo_instagram:
        description: "Prova Instagram: pubblica SOLO su Instagram (carosello e Reel veri, con [PROVA] in didascalia), niente email o Telegram"
        type: boolean
        default: false

# Evita doppi invii se cron-job.org spara due trigger ravvicinati:
# il secondo run attende (non cancella) ma non gira in parallelo.
concurrency:
  group: newsletter-niv-invio
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - name: Controlla corsi.json
        # Non blocca l'invio: un errore compare come avviso giallo nel riepilogo del run.
        continue-on-error: true
        run: python corsi.py

  invia-newsletter-niv:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Newsletter pochi minuti; il podcast (voce Gemini, verifica Whisper, video) fino a 25.
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # L'invio usa solo la libreria standard (SMTP con smtplib). Playwright serve solo alle
      # schede delle immagini per Instagram: non bloccante, senza si pubblica senza schede.
      - name: Installa Chromium (schede per Instagram)
        continue-on-error: true
        run: |
          pip install playwright==1.49.0
          playwright install --with-deps chromium

      - name: Installa ffmpeg (Reel per Instagram)
        continue-on-error: true
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      # Podcast: Whisper (verifica della voce e sottotitoli), numeri in lettere, audio. Non
      # bloccante: se fallisce, la newsletter esce senza podcast. Il modello resta in cache.
      - name: Cache modelli e pacchetti del podcast
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: podcast-niv-v1

      - name: Installa dipendenze podcast
        id: dipendenze_podcast
        continue-on-error: true
        timeout-minutes: 10
        run: pip install faster-whisper==1.2.1 num2words==0.5.14 soundfile librosa==0.11.0

      - name: Verifica test offline
        run: python -m unittest discover -s tests -v

      - name: Controlla corsi.json
        # Non blocca l'invio: un errore compare come avviso giallo nel riepilogo del run.
        continue-on-error: true
        run: python corsi.py

      # Segna l'ora d'inizio (UTC, al millisecondo): l'avviso per email legge dal log solo le
      # righe di questo run, non quelle dei test che scrivono nello stesso file e finiscono
      # nello stesso secondo.
      - name: Segna l'inizio della newsletter
        run: echo "NEWSLETTER_INIZIO=$(date -u '+%Y-%m-%d %H:%M:%S,%3N')" >> "$GITHUB_ENV"

      - name: Esegui newsletter NIV
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Podcast allegato alla mail: voce Gemini. Senza la chiave la mail parte senza podcast.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PODCAST_DIPENDENZE: ${{ steps.dipendenze_podcast.outcome || 'skipped' }}
          # Vuoto quando il workflow parte da cron-job.org: l'invio resta il default.
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          SOLO_INSTAGRAM: ${{ inputs.solo_instagram && '1' || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Instagram (carosello): senza IG_USER_ID non si pubblica. Le foto delle diapositive
          # passano dalla Pagina Facebook (stessi secret di EM e POCUS).
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          # X (ex Twitter): post con il Reel; senza queste chiavi X viene saltato
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python newsletter_NIV.py

      # Caricato anche quando lo step precedente fallisce: il log e' proprio
      # cio' che serve quando qualcosa e' andato storto.
      - name: Carica anteprima e log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-niv-${{ github.run_number }}
          path: |
            anteprima_digest.html
            newsletter_niv.log
            immagini/
            instagram/
            podcast/
          if-no-files-found: warn
          retention-days: 30

      # Email a AVVISI_EMAIL solo se un invio e' fallito o e' uscito incompleto (errori nel log
      # del run). Se va tutto bene non scrive. Mai bloccante. Non parte nelle prove.
      - name: Avvisa per email se qualcosa e' andato storto
        if: always() && !inputs.dry_run && !inputs.solo_instagram
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          AVVISI_EMAIL: ${{ secrets.AVVISI_EMAIL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python avviso.py
