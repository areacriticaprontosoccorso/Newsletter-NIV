<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter NIV — Iscriviti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0c0b09;
      color: #f0ece3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 500px;
      background: radial-gradient(ellipse at center, rgba(201,168,92,0.10) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    /* Grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    main {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 500px;
      width: 100%;
      animation: fadeUp 0.8s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #b8a06a;
      margin-bottom: 1.25rem;
      animation: fadeUp 0.8s 0.1s ease both;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(38px, 8vw, 56px);
      font-weight: 400;
      line-height: 1.1;
      color: #f5f0e8;
      margin-bottom: 0.2em;
      animation: fadeUp 0.8s 0.2s ease both;
    }

    h1 em {
      font-style: italic;
      color: #c9a85c;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a85c, transparent);
      margin: 1.5rem auto;
      animation: fadeUp 0.8s 0.3s ease both;
    }

    .description {
      font-size: 15px;
      font-weight: 300;
      color: #888;
      line-height: 1.7;
      margin-bottom: 2rem;
      animation: fadeUp 0.8s 0.35s ease both;
    }

    /* Form */
    form {
      display: flex;
      gap: 0;
      width: 100%;
      max-width: 420px;
      margin: 0 auto 1rem;
      animation: fadeUp 0.8s 0.4s ease both;
    }

    input[type="email"] {
      flex: 1;
      height: 48px;
      padding: 0 18px;
      background: rgba(255,255,255,0.05);
      border: 0.5px solid rgba(201,168,92,0.35);
      border-right: none;
      border-radius: 3px 0 0 3px;
      color: #f0ece3;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.25s, background 0.25s;
    }

    input[type="email"]::placeholder { color: #484440; }

    input[type="email"]:focus {
      background: rgba(255,255,255,0.08);
      border-color: rgba(201,168,92,0.75);
    }

    button[type="submit"] {
      height: 48px;
      padding: 0 22px;
      background: #c9a85c;
      border: none;
      border-radius: 0 3px 3px 0;
      color: #0c0b09;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, transform 0.1s;
    }

    button[type="submit"]:hover { background: #d4b46e; }
    button[type="submit"]:active { transform: scale(0.97); }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }

    .privacy {
      font-size: 11px;
      color: #484440;
      margin-top: 0.75rem;
      animation: fadeUp 0.8s 0.5s ease both;
    }

    /* Success state */
    .success-msg {
      display: none;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 20px;
      color: #c9a85c;
      margin-top: 1.5rem;
      animation: fadeUp 0.6s ease both;
    }

    .success-msg span {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-style: normal;
      font-size: 13px;
      color: #666;
      margin-top: 0.4rem;
    }

    /* Error */
    .error-msg {
      display: none;
      font-size: 13px;
      color: #c0695a;
      margin-top: 0.5rem;
    }

    /* Decorative corner marks */
    .corner {
      position: fixed;
      width: 30px;
      height: 30px;
      border-color: rgba(201,168,92,0.2);
      border-style: solid;
    }
    .corner-tl { top: 24px; left: 24px; border-width: 1px 0 0 1px; }
    .corner-tr { top: 24px; right: 24px; border-width: 1px 1px 0 0; }
    .corner-bl { bottom: 24px; left: 24px; border-width: 0 0 1px 1px; }
    .corner-br { bottom: 24px; right: 24px; border-width: 0 1px 1px 0; }

    @media (max-width: 480px) {
      form { flex-direction: column; }
      input[type="email"] {
        border-right: 0.5px solid rgba(201,168,92,0.35);
        border-bottom: none;
        border-radius: 3px 3px 0 0;
        width: 100%;
      }
      button[type="submit"] {
        border-radius: 0 0 3px 3px;
        width: 100%;
      }
      .corner { display: none; }
    }
  </style>
</head>
<body>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <main>
    <p class="eyebrow">Iscrizione</p>
    <h1>Newsletter <em>NIV</em></h1>
    <div class="divider"></div>
    <p class="description">Ricevi ogni numero direttamente nella tua casella.<br>Niente spam, disiscrizione con un click.</p>

    <form id="niv-form" action="https://formspree.io/f/xaqkplwb" method="POST">
      <input
        type="email"
        name="email"
        placeholder="la-tua@email.com"
        required
        autocomplete="email"
        aria-label="Indirizzo email"
      />
      <button type="submit" id="submit-btn">Iscriviti →</button>
    </form>

    <p class="privacy">I tuoi dati non vengono condivisi con terze parti.</p>
    <p class="error-msg" id="error-msg">Qualcosa è andato storto. Riprova tra poco.</p>
    <div class="success-msg" id="success-msg">
      Benvenuto/a nella NIV. ✦
      <span>Controlla la tua casella per la conferma.</span>
    </div>
  </main>

  <script>
    const form = document.getElementById('niv-form');
    const btn = document.getElementById('submit-btn');
    const successMsg = document.getElementById('success-msg');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.textContent = '…';
      btn.disabled = true;
      errorMsg.style.display = 'none';

      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (res.ok) {
          form.style.display = 'none';
          document.querySelector('.privacy').style.display = 'none';
          successMsg.style.display = 'block';
        } else {
          throw new Error('Server error');
        }
      } catch {
        errorMsg.style.display = 'block';
        btn.textContent = 'Iscriviti →';
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
